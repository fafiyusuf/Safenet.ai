version: '3.8'

services:
  # Backend Express API
  backend:
    build:
      context: ./Backend-Express
      dockerfile: Dockerfile
    container_name: safenet-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin_1234}
      - JWT_SECRET=${JWT_SECRET:-safenet-production-secret-key-replace}
      - CORS_ORIGIN=http://localhost:3000
      - PORT=8000
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Frontend Next.js
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: safenet-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - JWT_SECRET=${JWT_SECRET:-safenet-production-secret-key-replace}
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: safenet-network
